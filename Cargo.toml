[package]
name = "spotify-rust"
version = "0.1.0"
edition = "2021"
description = "Cliente nativo ultra-leve para o Spotify"
build = "build.rs"

[dependencies]
# Concorrência e Assincronismo
tokio = { version = "1.32", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"

# Networking e Web API
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
rspotify = { version = "0.12", features = ["client-reqwest", "reqwest-rustls-tls"], default-features = false }
url = "2.4"
urlencoding = "2.1"

# Spotify Connect & Audio Stream (librespot)
librespot = { version = "0.4", default-features = false, features = ["rodio-backend"] }
librespot-core = "0.4"
librespot-protocol = "0.4"

# Audio Playback
rodio = "0.17"

# GUI Nativa
slint = "1.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Banco de dados e Cache
rusqlite = { version = "0.29", features = ["bundled"] }

# Utilidades
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
md5 = "0.7"
tiny_http = "0.12"
webbrowser = "0.8"
dotenv = "0.15"

[build-dependencies]
slint-build = "1.2"

[profile.release]
opt-level = "z"     # Otimizar para tamanho
lto = true          # Link Time Optimization para remover código morto
strip = true        # Remover símbolos de debug
codegen-units = 1   # Melhorar LTO
panic = "abort"     # Reduzir tamanho (remove stack unwinding)
